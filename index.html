<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quét Mã Vận Đơn & Đóng Gói</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f7f6; margin: 0; }
    h2 { color: #2c3e50; font-size: 22px; margin-bottom: 20px; }
    .box { background: white; border-radius: 12px; padding: 25px 20px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.08); }
    input[type="text"] { width: 100%; padding: 15px; font-size: 18px; border: 2px solid #27ae60; border-radius: 8px; box-sizing: border-box; text-align: center; outline: none; margin-bottom: 15px; }
    input[type="text"]:focus { border-color: #219653; box-shadow: 0 0 5px rgba(39, 174, 96, 0.5); }
    
    /* Thiết kế nút bấm Đã đóng gói */
    .btn-pack {
      width: 100%;
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 14px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-pack:hover { background-color: #219653; }
    .btn-pack:active { background-color: #1e8449; }
    .btn-pack:disabled { background-color: #95a5a6; cursor: not-allowed; }

    #result { margin-top: 15px; font-size: 16px; font-weight: bold; color: #27ae60; min-height: 24px; }
    #history { margin-top: 25px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  </style>
</head>
<body>
  <h2>📦 Quét Mã & Xác Nhận Đóng Gói</h2>
  
  <div class="box">
    <input type="text" id="barcodeInput" placeholder="Click vào đây rồi quét hoặc nhập mã..." autofocus autocomplete="off">
    
    <!-- Nút bấm xác nhận đã đóng gói -->
    <button type="button" id="btnConfirm" class="btn-pack" onclick="thucHienDongGoi()">✅ Đã Đóng Gói</button>
    
    <div id="result">Sẵn sàng nhận mã...</div>
  </div>

  <div id="history">
    <h3 style="margin-top:0; font-size: 15px; color: #333;">Lịch sử quét gần đây:</h3>
    <ul id="listHistory" style="padding-left: 20px; font-size: 14px; margin-bottom:0;"></ul>
  </div>

  <script>
    const inputField = document.getElementById('barcodeInput');
    const btnConfirm = document.getElementById('btnConfirm');
    const elementResult = document.getElementById('result');
    const listHistory = document.getElementById('listHistory');

    // Tự động focus vào ô nhập liệu khi mở web
    window.onload = function() {
      inputField.focus();
    };

    // Hàm chung xử lý lưu dữ liệu xuống Google Sheet
    function thucHienDongGoi() {
      let ma = inputField.value.trim();
      if (!ma) {
        elementResult.innerText = "⚠️ Vui lòng quét hoặc nhập mã đơn!";
        inputField.focus();
        return;
      }

      elementResult.innerText = "⏳ Đang lưu: " + ma;
      inputField.disabled = true;
      btnConfirm.disabled = true;

      google.script.run
        .withSuccessHandler(function(response) {
          elementResult.innerText = "✅ Đã lưu thành công: " + ma;
          let timeString = new Date().toLocaleTimeString();
          let li = document.createElement('li');
          li.innerText = ma + " (" + timeString + ")";
          listHistory.prepend(li);
          
          inputField.value = "";
          inputField.disabled = false;
          btnConfirm.disabled = false;
          inputField.focus();
        })
        .withFailureHandler(function(error) {
          elementResult.innerText = "❌ Lỗi lưu: " + error.message;
          inputField.disabled = false;
          btnConfirm.disabled = false;
          inputField.focus();
        })
        .ghiNhanMaVanDon(ma);
    }

    // Hỗ trợ nhấn phím Enter (nếu dùng máy quét tự bắn phím Enter)
    inputField.addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        thucHienDongGoi();
      }
    });
  </script>
</body>
</html>
