<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quét Mã Vận Đơn - Tích Tức Thì</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #f4f6f9; padding: 15px; color: #333; }
    .container { max-width: 500px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1e3c72; margin-bottom: 15px; font-size: 20px; }
    .config-box { margin-bottom: 15px; }
    .config-box label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
    .config-box input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 13px; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; background: #000; min-height: 250px; }
    
    .status-box { margin-top: 15px; padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 15px; min-height: 48px; display: flex; align-items: center; justify-content: center; }
    .status-waiting { background: #e9ecef; color: #495057; }
    .status-scanned { background: #cce5ff; color: #004085; border: 1px solid #b8daff; }
    .status-success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-duplicate { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
    .status-error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    
    .history-title { margin-top: 20px; font-size: 15px; font-weight: bold; color: #333; border-bottom: 2px solid #1e3c72; padding-bottom: 5px; }
    .history-list { list-style: none; margin-top: 10px; max-height: 200px; overflow-y: auto; }
    .history-item { background: #f8f9fa; border: 1px solid #e9ecef; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
    
    .badge-success { background: #28a745; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-duplicate { background: #ffc107; color: #333; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    .badge-error { background: #dc3545; color: white; padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
    
    .controls { margin-top: 15px; display: flex; gap: 10px; }
    .btn { padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; }
    .btn-start { background: #007bff; color: white; flex: 1; }
    .btn-stop { background: #6c757d; color: white; flex: 1; }
    
    /* Nút bấm ĐÃ ĐÓNG GÓI nổi bật */
    .btn-pack { 
      background: #28a745; 
      color: white; 
      width: 100%; 
      margin-top: 15px; 
      font-size: 16px; 
      padding: 15px; 
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
      transition: all 0.2s;
    }
    .btn-pack:disabled {
      background: #cccccc;
      color: #666666;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>📷 Quét Mã Vận Đơn</h2>
  <div class="config-box">
    <label for="scriptUrl">Dán Web App URL Apps Script tại đây:</label>
    <input type="text" id="scriptUrl" placeholder="https://script.google.com/macros/s/.../exec" onchange="saveUrl()">
  </div>
  
  <div id="reader"></div>
  
  <div class="controls">
    <button class="btn btn-start" onclick="startScanner()">Mở Camera</button>
    <button class="btn btn-stop" onclick="stopScanner()">Tắt Camera</button>
  </div>

  <div id="status" class="status-box status-waiting">Sẵn sàng quét mã...</div>

  <!-- NÚT BẤM ĐÃ ĐÓNG GÓI CỦA NHÂN VIÊN -->
  <button id="packBtn" class="btn btn-pack" onclick="confirmPack()" disabled>📦 BẤM VÀO ĐÂY ĐỂ ĐÓNG GÓI</button>

  <div class="history-title">📋 Lịch sử quét gần đây</div>
  <ul id="history" class="history-list"></ul>
</div>

<script>
  let html5QrCode;
  let currentScannedCode = ""; // Lưu mã đang chờ xác nhận đóng gói
  let isProcessing = false;
  let audioCtx = null;

  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  window.onload = function() {
    const savedUrl = localStorage.getItem("apps_script_url");
    if (savedUrl) document.getElementById("scriptUrl").value = savedUrl;
  };

  function saveUrl() {
    const url = document.getElementById("scriptUrl").value.trim();
    localStorage.setItem("apps_script_url", url);
  }

  // Âm thanh khi quét thành công
  function playSuccessBeep() {
    try {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(1800, ctx.currentTime);
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime);
      osc.stop(ctx.currentTime + 0.08);
    } catch(e) {}
  }

  // Âm thanh khi báo TRÙNG
  function playDuplicateBeep() {
    try {
      const ctx = getAudioContext();
      const osc1 = ctx.createOscillator();
      const gain1 = ctx.createGain();
      osc1.type = "sawtooth";
      osc1.frequency.setValueAtTime(600, ctx.currentTime);
      gain1.gain.setValueAtTime(0.6, ctx.currentTime);
      osc1.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start(ctx.currentTime);
      osc1.stop(ctx.currentTime + 0.15);

      const osc2 = ctx.createOscillator();
      const gain2 = ctx.createGain();
      osc2.type = "sawtooth";
      osc2.frequency.setValueAtTime(600, ctx.currentTime + 0.2);
      gain2.gain.setValueAtTime(0.6, ctx.currentTime + 0.2);
      osc2.connect(gain2);
      gain2.connect(ctx.destination);
      osc2.start(ctx.currentTime + 0.2);
      osc2.stop(ctx.currentTime + 0.35);
    } catch(e) {}
  }

  function triggerVibrate(pattern = 100) {
    if (navigator.vibrate) navigator.vibrate(pattern);
  }

  function startScanner() {
    getAudioContext();

    if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
    
    const config = { 
      fps: 25, 
      qrbox: { width: 280, height: 180 },
      experimentalFeatures: { useBarCodeDetectorIfSupported: true }
    };

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess).catch(err => {
      setStatus("Không mở được camera: " + err, "error");
    });
  }

  function stopScanner() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => setStatus("Đã tắt camera", "waiting")).catch(err => console.error(err));
    }
  }

  // 1. KHI CAMERA ĐỌC ĐƯỢC MÃ -> TẠM GIỮ MÃ VÀ BẬT NÚT ĐÓNG GÓI
  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    
    // Nếu mã mới khác mã đang chờ
    if (decodedText !== currentScannedCode) {
      currentScannedCode = decodedText;
      triggerVibrate(50);
      
      setStatus(`🔍 Đã nhận mã: ${decodedText} (Bấm nút bên dưới để lưu)`, "scanned");
      
      // Kích hoạt nút Đóng Gói
      const packBtn = document.getElementById("packBtn");
      packBtn.disabled = false;
      packBtn.innerText = `📦 XÁC NHẬN ĐÓNG GÓI (${decodedText})`;
    }
  }

  // 2. KHI NHÂN VIÊN BẤM NÚT "ĐÃ ĐÓNG GÓI"
  function confirmPack() {
    if (!currentScannedCode) return;

    isProcessing = true;
    const packBtn = document.getElementById("packBtn");
    packBtn.disabled = true;
    packBtn.innerText = "⏳ Đang lưu...";

    sendToGoogleSheet(currentScannedCode);
  }

  function sendToGoogleSheet(maVanDon) {
    const scriptUrl = document.getElementById("scriptUrl").value.trim();
    if (!scriptUrl) {
      setStatus("Vui lòng dán Web App URL của Apps Script trước!", "error");
      isProcessing = false;
      return;
    }

    const timeNow = new Date().toLocaleTimeString();
    const url = `${scriptUrl}?maVanDon=${encodeURIComponent(maVanDon)}`;
    
    fetch(url)
      .then(response => response.json())
      .then(data => {
        if (data.success || data.status === "success") {
          playSuccessBeep();
          triggerVibrate(80);
          setStatus(`✅ Đã đóng gói: ${maVanDon}`, "success");
          addHistory(data.maVanDon || maVanDon, data.thoiGian || timeNow, "Đã đóng gói", "success");
          
          // Reset trạng thái sẵn sàng cho đơn sau
          currentScannedCode = "";
          document.getElementById("packBtn").innerText = "📦 BẤM VÀO ĐÂY ĐỂ ĐÓNG GÓI";
        } else if (data.duplicate || data.status === "duplicate") {
          playDuplicateBeep();
          triggerVibrate([150, 100, 150]);
          setStatus(`⚠️ Trùng đơn trong Sheet: ${maVanDon}`, "duplicate");
          addHistory(data.maVanDon || maVanDon, timeNow, "Trùng mã", "duplicate");
          
          currentScannedCode = "";
          document.getElementById("packBtn").innerText = "📦 BẤM VÀO ĐÂY ĐỂ ĐÓNG GÓI";
        } else {
          setStatus(`🔴 Lỗi Sheet: ${data.message}`, "error");
          addHistory(maVanDon, timeNow, "Lỗi Sheet", "error");
        }
        isProcessing = false;
      })
      .catch(err => {
        console.warn("Mạng chậm, tự động gửi bằng mode dự phòng no-cors:", err);
        fetch(url, { mode: 'no-cors' })
          .then(() => {
            playSuccessBeep();
            setStatus(`✅ Đã đóng gói: ${maVanDon}`, "success");
            addHistory(maVanDon, timeNow, "Đã đóng gói", "success");
            
            currentScannedCode = "";
            document.getElementById("packBtn").innerText = "📦 BẤM VÀO ĐÂY ĐỂ ĐÓNG GÓI";
          })
          .catch(() => {
            setStatus(`🔴 Lỗi kết nối mạng khi gửi mã ${maVanDon}`, "error");
            addHistory(maVanDon, timeNow, "Lỗi kết nối", "error");
          })
          .finally(() => {
            isProcessing = false;
          });
      });
  }

  function setStatus(text, type) {
    const statusDiv = document.getElementById("status");
    statusDiv.className = `status-box status-${type}`;
    statusDiv.innerText = text;
  }

  function addHistory(code, time, note, type) {
    const historyList = document.getElementById("history");
    const li = document.createElement("li");
    li.className = "history-item";
    
    let badgeClass = "badge-success";
    if (type === "duplicate") badgeClass = "badge-duplicate";
    if (type === "error") badgeClass = "badge-error";

    li.innerHTML = `<span><strong>${code}</strong> <small>(${time})</small></span><span class="${badgeClass}">${note}</span>`;
    historyList.insertBefore(li, historyList.firstChild);
  }
</script>
</body>
</html>
